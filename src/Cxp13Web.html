<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{font:15px/1.5 Arial,sans-serif;color:#17212b;background:#f5f7fa}body{margin:0}.wrap{max-width:820px;margin:32px auto;padding:0 18px}.card{background:#fff;border:1px solid #d9e0e7;border-radius:12px;padding:22px;box-shadow:0 4px 18px #17212b10}h1{font-size:24px;margin:0 0 4px}.muted{color:#607080}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}.metric{background:#f7f9fb;border-radius:8px;padding:12px}.label{font-size:12px;color:#607080;text-transform:uppercase}.value{font-weight:700;word-break:break-word}.progress{height:12px;background:#e7ecf2;border-radius:999px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;width:0;background:#165dff;transition:width .25s ease}.progress-copy{display:flex;justify-content:space-between;gap:16px;margin-top:7px;font-size:13px;color:#607080}.recovery{color:#8a4b00;font-weight:700;margin:10px 0}button{border:0;border-radius:8px;background:#165dff;color:#fff;font-weight:700;padding:11px 16px;cursor:pointer}button:disabled{background:#9aa8b8;cursor:not-allowed}.error{color:#a32020;margin-top:14px;white-space:pre-wrap}.ok{color:#18743c}
  </style>
</head>
<body><main class="wrap"><section class="card"><h1>RTA intake</h1><div class="muted">Process the latest complete controlled-inbox delivery.</div><div class="grid"><div class="metric"><div class="label">Bundle</div><div id="bundle" class="value">Loading…</div></div><div class="metric"><div class="label">Run status</div><div id="status" class="value">Loading…</div></div><div class="metric"><div class="label">Phase</div><div id="phase" class="value">—</div></div><div class="metric"><div class="label">Dataset</div><div id="dataset" class="value">—</div></div><div class="metric"><div class="label">Dataset rows</div><div id="rows" class="value">—</div></div><div class="metric"><div class="label">Elapsed / remaining</div><div id="timing" class="value">—</div></div><div class="metric"><div class="label">Active week</div><div id="week" class="value">—</div></div><div class="metric"><div class="label">Active data</div><div id="active" class="value">—</div></div></div><div id="progressWrap"><div class="label">Current dataset progress</div><div class="progress" role="progressbar" aria-label="Current dataset progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progressBar"></span></div><div class="progress-copy"><span id="progressText">Waiting for a run</span><span id="updated">—</span></div></div><div id="recovery" class="recovery"></div><button id="start" disabled>Process latest bundle</button><div id="health" class="muted"></div><div id="error" class="error" role="alert"></div></section></main>
<script>
  const ui={bundle:document.getElementById('bundle'),status:document.getElementById('status'),phase:document.getElementById('phase'),dataset:document.getElementById('dataset'),rows:document.getElementById('rows'),timing:document.getElementById('timing'),week:document.getElementById('week'),active:document.getElementById('active'),progress:document.querySelector('[role="progressbar"]'),progressBar:document.getElementById('progressBar'),progressText:document.getElementById('progressText'),updated:document.getElementById('updated'),recovery:document.getElementById('recovery'),start:document.getElementById('start'),health:document.getElementById('health'),error:document.getElementById('error')};
  let current=null,timer=null;
  function duration(ms){if(!Number.isFinite(ms)||ms<0)return'—';const total=Math.round(ms/1000),minutes=Math.floor(total/60),seconds=total%60;return minutes?minutes+'m '+seconds+'s':seconds+'s'}
  function errorText(error){if(!error)return'';const d=error.details||{},parts=[error.code];if(d.datasetName)parts.push(d.datasetName);if(d.operation)parts.push(d.operation);if(d.reason)parts.push(d.reason);if(d.columnName)parts.push('column '+d.columnName);if(d.intendedValueType||d.persistedValueType)parts.push((d.intendedValueType||'?')+' → '+(d.persistedValueType||'?'));return parts.join(' · ')}
  function render(value){current=value;const percent=Number.isFinite(value.percentComplete)?Math.max(0,Math.min(100,value.percentComplete)):0;ui.bundle.textContent=value.batchToken||'No complete bundle';ui.status.textContent=value.status||'IDLE';ui.phase.textContent=value.phase||'—';ui.dataset.textContent=value.datasetName||'—';ui.rows.textContent=Number.isInteger(value.completedRows)&&Number.isInteger(value.totalRows)?value.completedRows.toLocaleString()+' / '+value.totalRows.toLocaleString():'—';ui.timing.textContent=duration(value.elapsedMs)+' / '+duration(value.estimatedRemainingMs);ui.week.textContent=value.activeWeekKey||'—';ui.active.textContent=value.activeDataAtUtc||'—';ui.progress.setAttribute('aria-valuenow',String(Math.round(percent)));ui.progressBar.style.width=percent+'%';ui.progressText.textContent=Number.isFinite(value.percentComplete)?Math.round(percent)+'% complete':'Waiting for progress';ui.updated.textContent=value.updatedAtUtc?'Updated '+value.updatedAtUtc:'—';ui.recovery.textContent=value.recoveryStatus?'Recovery: '+value.recoveryStatus:'';ui.health.textContent=value.health?(value.health.healthy?'System healthy':'Health: '+value.health.codes.join(', ')):'';ui.error.textContent=errorText(value.error);const busy=['QUEUED','PROCESSING'].includes(value.status);ui.start.disabled=busy||value.status!=='READY';if(timer)clearTimeout(timer);if(busy)timer=setTimeout(refreshRun,5000)}
  function fail(error){ui.error.textContent=error&&error.message?error.message:'Request failed';ui.start.disabled=false}
  function refresh(){google.script.run.withSuccessHandler(render).withFailureHandler(fail).cxp13GetIntakeStatus()}
  function refreshRun(){google.script.run.withSuccessHandler(render).withFailureHandler(fail).cxp13GetRunStatus(current&&current.runId)}
  ui.start.addEventListener('click',()=>{ui.start.disabled=true;ui.error.textContent='';google.script.run.withSuccessHandler(render).withFailureHandler(fail).cxp13StartLatestBundle(current.batchToken)});
  refresh();
</script></body></html>
